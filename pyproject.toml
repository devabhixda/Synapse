[project]
# `synapse` and `synapse-memory` are taken on PyPI by unrelated projects, and
# PyPI refuses `synapse-mem` as too close to the latter. This is the
# distribution name only; the import stays `synapse`.
name = "synapse-recall"
version = "0.2.5"
description = "Episodic and semantic memory over workplace conversations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abhi Jain" }]
keywords = ["memory", "knowledge-graph", "episodic", "rag", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "json-repair>=0.47,<1",
  "mcp>=1.27,<2",
  # Pinned exactly: the sqlite_vec provider registers itself through two
  # private Mem0 registries and an import path its config validator derives
  # from the provider name. tests/test_sqlite_vec_registry.py fails loudly if
  # a Mem0 upgrade moves any of them, but only if the version cannot drift on
  # its own first.
  "mem0ai==2.0.14",
  "numpy>=1.26,<3",
  "pydantic-settings>=2.10,<3",
  # Pinned exactly: sqlite-vec is pre-v1 and its releases warn about breaking
  # changes to the vec0 table syntax this depends on.
  "sqlite-vec==0.1.9",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/devabhixda/Synapse"
Source = "https://github.com/devabhixda/Synapse"
Issues = "https://github.com/devabhixda/Synapse/issues"

[project.scripts]
synapse-api = "synapse.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["synapse"]
