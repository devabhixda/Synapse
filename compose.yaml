name: synapse

# The api, worker, and mcp services all open the same SQLite file on the
# synapse-data volume, so it is mounted into each of them. Concurrent access is
# what WAL and busy_timeout in synapse.db.session are for; a Docker named
# volume is local disk, where SQLite's locking works as documented.
x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: sqlite+aiosqlite:////data/synapse.db
    CHAT_BASE_URL: ${CHAT_BASE_URL:-http://host.docker.internal:8080/v1}
    EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:8080/v1}
    CHAT_REASONING_TOKENS: ${CHAT_REASONING_TOKENS:-0}
  volumes:
    - synapse-data:/data
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    restart: no

  api:
    <<: *backend
    command: [uvicorn, synapse.api.main:app, --host, 0.0.0.0, --port, "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - ${SYNAPSE_API_PORT:-8000}:8000

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1/]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - ${SYNAPSE_WEB_PORT:-3000}:80

  worker:
    <<: *backend
    command: [python, -m, synapse.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully

  mcp:
    <<: *backend
    command: [python, -m, synapse.mcp.server]
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [tools]
    stdin_open: true

  # Tests build their own SQLite file per test in a temp directory, so this
  # needs no database of its own and nothing to wait for.
  test:
    <<: *backend
    command: [pytest]
    profiles: [test]

volumes:
  synapse-data:
